title: Econ Manuscript
author: Kazuharu Yanagimoto
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    common:
      number-sections: true
      fontsize: 11pt
      linestretch: 1.5
      reference-location: document
      citeproc: true
      link-citations: true
      shortcodes:
        - appendix.lua
    typst:
      papersize: us-letter
      margin:
        x: 1.25in
        y: 1.25in
      # No mainfont here: the template defaults to New Computer Modern but lets a
      # brand (brand.typography) or an explicit `mainfont` override it.
      section-numbering: "1.1.1"
      # Elegant deep-navy link colour (overridable; also picks up brand.color.link).
      linkcolor: "1B4F72"
      citecolor: "1B4F72"
      template-partials:
        - typst-template.typ
        - typst-show.typ
    pdf:
      documentclass: article
      papersize: letter
      geometry:
        - margin=1.25in
      cite-method: citeproc
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - partials/preamble.tex
